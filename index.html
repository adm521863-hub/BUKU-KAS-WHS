<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Warehouse X GLX - Laporan Kas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b1120;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        .glass-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.9) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        /* Input number without arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] { -moz-appearance: textfield; }

        @media print {
            @page { size: A4; margin: 1.5cm; }
            body { background-color: white !important; color: black !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .glass-card { background: white !important; border: none !important; box-shadow: none !important; padding: 0 !important; }
            * { color: black !important; text-shadow: none !important; }
            table { width: 100%; border-collapse: collapse; }
            th, td { border: 1px solid #cbd5e1; padding: 8px; }
            th { background-color: #f1f5f9 !important; -webkit-print-color-adjust: exact; }
        }
        .print-only { display: none; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes modalShow { from { opacity: 0; transform: scale(0.95) translate(-50%, -50%); } to { opacity: 1; transform: scale(1) translate(-50%, -50%); } }
        .modal-animate { animation: modalShow 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: { 900: '#0b1120', 800: '#162032', 700: '#1e293b' },
                        accent: { green: '#10b981', red: '#ef4444', yellow: '#f59e0b', blue: '#3b82f6' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-900 min-h-screen text-slate-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const formatRp = (value) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(value || 0);
        const formatNumberOnly = (value) => new Intl.NumberFormat('id-ID').format(value || 0);
        
        // Fungsi baru untuk format titik otomatis saat mengetik
        const formatInput = (value) => {
            if (!value) return '';
            const numberString = value.toString().replace(/[^0-9]/g, '');
            return numberString.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        };
        // Fungsi baru untuk merubah kembali menjadi angka bulat (tanpa titik) untuk disimpan
        const parseInput = (value) => parseInt(value.toString().replace(/\./g, '')) || 0;

        const formatDate = (dateString) => {
            if (!dateString) return '';
            return new Date(dateString).toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' });
        };
        const getTodayString = () => new Date().toISOString().split('T')[0];

        // Icons
        const IconCheck = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"></polyline></svg>;
        const IconX = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
        const IconArrowUpCircle = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><polyline points="16 12 12 8 8 12"></polyline><line x1="12" y1="16" x2="12" y2="8"></line></svg>;
        const IconArrowDownCircle = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><polyline points="8 12 12 16 16 12"></polyline><line x1="12" y1="8" x2="12" y2="16"></line></svg>;
        const IconWallet = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path></svg>;
        const IconUtensils = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"></path><path d="M7 2v20"></path><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"></path></svg>;
        const IconFileText = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line></svg>;
        const IconHome = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>;
        const IconPrinter = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>;
        const IconShare = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>;
        const IconPlus = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const IconTrash = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;
        const IconBuilding = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><path d="M9 22v-4h6v4"></path></svg>;
        const IconCalendar = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>;
        const IconPencil = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>;
        const IconBell = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>;

        const CustomModal = ({ isOpen, title, message, onConfirm, onCancel, confirmText = "Konfirmasi", isDestructive = true }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 no-print">
                    <div className="bg-dark-800 border border-slate-700 rounded-2xl w-full max-w-sm shadow-2xl modal-animate overflow-hidden">
                        <div className="p-5">
                            <h3 className="text-lg font-bold text-white mb-2">{title}</h3>
                            <p className="text-sm text-slate-300">{message}</p>
                        </div>
                        <div className="p-3 bg-dark-900/50 flex justify-end gap-2 border-t border-slate-700/50">
                            <button onClick={onCancel} className="px-4 py-2 text-sm font-medium text-slate-300 hover:text-white bg-dark-700 rounded-lg">Batal</button>
                            <button onClick={onConfirm} className={`px-4 py-2 text-sm font-medium text-white rounded-lg transition ${isDestructive ? 'bg-red-600' : 'bg-emerald-600'}`}>{confirmText}</button>
                        </div>
                    </div>
                </div>
            );
        };

        const generateInitialMeals = () => {
            const days = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];
            return days.map((day, index) => ({ id: index + 1, day: day, amount: 0 }));
        };

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [modalConfig, setModalConfig] = useState({ isOpen: false });
            
            const [transactions, setTransactions] = useState(() => {
                const saved = localStorage.getItem('glx_transactions_v4');
                return saved ? JSON.parse(saved) : [];
            });
            const [meals, setMeals] = useState(() => {
                const saved = localStorage.getItem('glx_meals_v4');
                return saved ? JSON.parse(saved) : generateInitialMeals();
            });
            const [saldoAwal, setSaldoAwal] = useState(() => {
                const saved = localStorage.getItem('glx_saldo_v4');
                return saved ? parseInt(saved) : 5000000;
            });
            const [budgetMakan, setBudgetMakan] = useState(() => {
                const saved = localStorage.getItem('glx_budget_makan_v4');
                return saved ? parseInt(saved) : 1200000;
            });
            const [showReminder, setShowReminder] = useState(() => {
                return localStorage.getItem('glx_reminder_date') !== getTodayString();
            });

            const todayStr = getTodayString();

            const summary = useMemo(() => {
                const kasMasuk = transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
                const pengeluaran = transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);
                const totalMakan = meals.reduce((sum, m) => sum + (m.amount || 0), 0);
                const sisaKas = saldoAwal + kasMasuk - pengeluaran;
                return { kasMasuk, pengeluaran, sisaKas, totalMakan };
            }, [transactions, saldoAwal, meals]);

            useEffect(() => {
                localStorage.setItem('glx_transactions_v4', JSON.stringify(transactions));
                localStorage.setItem('glx_meals_v4', JSON.stringify(meals));
                localStorage.setItem('glx_saldo_v4', saldoAwal.toString());
                localStorage.setItem('glx_budget_makan_v4', budgetMakan.toString());
            }, [transactions, meals, saldoAwal, budgetMakan]);

            const handleShareWA = (customTxs, customDateLabel, customSummary) => {
                const txsToUse = customTxs || transactions;
                const sumToUse = customSummary || summary;
                const dateLabel = customDateLabel || formatDate(todayStr);
                
                let text = `*#LAPORANKAS*\nTanggal: ${dateLabel}\n\n`;
                
                const incomeTxs = txsToUse.filter(t => t.type === 'income');
                if (incomeTxs.length > 0) {
                    text += `*KAS MASUK:*\n`;
                    incomeTxs.forEach((t, i) => {
                        text += `${i+1}. ${t.name.toUpperCase()}`;
                        if (t.description) text += ` - ${t.description}`;
                        text += ` : ${formatNumberOnly(t.amount)}\n`;
                    });
                    text += `\n`;
                }

                text += `*PENGELUARAN:*\n`;
                const expenseTxs = txsToUse.filter(t => t.type === 'expense');
                if (expenseTxs.length === 0) text += `- Tidak ada\n`;
                expenseTxs.forEach((t, i) => {
                    text += `${i+1}. ${t.name.toUpperCase()}`;
                    if (t.description) text += ` - ${t.description}`;
                    text += ` : ${formatNumberOnly(t.amount)}\n`;
                });

                text += `\n------------------------\n`;
                text += `TOTAL KAS MASUK: ${formatRp(sumToUse.kasMasuk)}\n`;
                text += `TOTAL PENGELUARAN: ${formatRp(sumToUse.pengeluaran)}\n`;
                if(sumToUse.totalMakan > 0) text += `UANG MAKAN: ${formatRp(sumToUse.totalMakan)}\n`;
                text += `*SISA KAS: ${formatRp(sumToUse.sisaKas)}*\n`;

                window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
            };

            const addTransaction = (newTx) => {
                setTransactions([{...newTx, id: Date.now()}, ...transactions]);
                setActiveTab('dashboard'); // Redirect to dashboard to see the new entry
            };

            const updateTransaction = (updatedTx) => {
                setTransactions(transactions.map(t => t.id === updatedTx.id ? updatedTx : t));
                setActiveTab('dashboard'); 
            };

            const confirmDeleteTransaction = (id) => {
                const tx = transactions.find(t => t.id === id);
                if(!tx) return;
                setModalConfig({
                    isOpen: true,
                    title: 'Hapus Transaksi',
                    message: `Yakin hapus transaksi "${tx.name}" senilai ${formatRp(tx.amount)}?`,
                    isDestructive: true,
                    confirmText: 'Hapus',
                    onConfirm: () => { setTransactions(transactions.filter(t => t.id !== id)); setModalConfig({ isOpen: false }); },
                    onCancel: () => setModalConfig({ isOpen: false })
                });
            };

            return (
                <div className="max-w-[480px] mx-auto min-h-screen flex flex-col relative bg-dark-900 overflow-hidden print:max-w-none print:bg-white print:text-black">
                    <CustomModal {...modalConfig} />
                    
                    {/* App Header (Persis seperti mockup) */}
                    <header className="pt-6 pb-4 px-5 relative z-10 no-print flex-shrink-0 border-b border-slate-800/50 bg-dark-900/90 backdrop-blur">
                        <div className="flex justify-between items-start mb-2">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-emerald-500/10 rounded-xl flex items-center justify-center border border-emerald-500/20 shadow-[0_0_15px_rgba(16,185,129,0.15)]">
                                    <IconBuilding className="text-emerald-400 w-6 h-6" />
                                </div>
                                <div>
                                    <h1 className="text-[10px] font-bold text-slate-400 tracking-widest uppercase">Warehouse X GLX</h1>
                                    <h2 className="text-xl font-extrabold text-white leading-tight">LAPORAN KAS</h2>
                                    <div className="flex items-center gap-1 mt-1 text-[11px] text-slate-500 font-medium">
                                        <IconCalendar className="w-3 h-3" /> Tanggal: {formatDate(todayStr)}
                                    </div>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => handleShareWA()} className="flex items-center gap-1.5 px-3 py-2 bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 rounded-lg text-xs font-bold hover:bg-emerald-600/30 transition">
                                    <IconShare className="w-4 h-4"/> Share WA
                                </button>
                                <button onClick={() => window.print()} className="flex items-center gap-1.5 px-3 py-2 bg-slate-800 text-slate-300 border border-slate-700 rounded-lg text-xs font-bold hover:bg-slate-700 transition">
                                    <IconPrinter className="w-4 h-4"/> Cetak PDF
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Content area */}
                    <main className="flex-1 px-4 py-5 overflow-y-auto no-print hide-scrollbar pb-24">
                        {showReminder && (
                            <div className="mb-5 p-3.5 bg-accent-blue/15 border border-accent-blue/30 rounded-2xl flex items-start gap-3 animate-fade-in relative shadow-[0_0_15px_rgba(59,130,246,0.15)]">
                                <div className="bg-accent-blue/20 p-2 rounded-xl text-accent-blue shadow-inner"><IconBell className="w-5 h-5"/></div>
                                <div className="pr-6 pt-0.5">
                                    <h4 className="text-sm font-bold text-accent-blue tracking-tight">Pengingat Admin</h4>
                                    <p className="text-xs text-slate-300 mt-1 leading-relaxed">Jangan lupa update dan cek laporan kas hari ini agar rekapitulasi tetap akurat.</p>
                                </div>
                                <button onClick={() => {localStorage.setItem('glx_reminder_date', todayStr); setShowReminder(false);}} className="absolute top-3 right-3 text-slate-400 hover:text-white p-1.5 bg-dark-900/50 hover:bg-dark-900/80 rounded-lg transition-all"><IconX className="w-4 h-4"/></button>
                            </div>
                        )}
                        {activeTab === 'dashboard' && <DashboardTab summary={summary} saldoAwal={saldoAwal} transactions={transactions} meals={meals} setActiveTab={setActiveTab} budgetMakan={budgetMakan} />}
                        {activeTab === 'kas' && <KasTab transactions={transactions} addTransaction={addTransaction} updateTransaction={updateTransaction} deleteTransaction={confirmDeleteTransaction} saldoAwal={saldoAwal} updateSaldoAwal={setSaldoAwal} />}
                        {activeTab === 'makan' && <MakanTab meals={meals} updateMeal={(id, amt) => setMeals(meals.map(m=>m.id===id?{...m,amount:amt}:m))} budgetMakan={budgetMakan} setBudgetMakan={setBudgetMakan} addTransaction={addTransaction} setMeals={setMeals} />}
                        {activeTab === 'laporan' && <LaporanTab summary={summary} transactions={transactions} meals={meals} saldoAwal={saldoAwal} todayStr={todayStr} handlePrint={() => window.print()} handleShareWA={handleShareWA}/>}
                    </main>

                    {/* Bottom Nav */}
                    <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] bg-dark-900/95 backdrop-blur-xl border-t border-slate-800 flex justify-around p-2 pb-safe z-50 no-print">
                        <NavItem icon={<IconHome className="w-6 h-6" />} label="Dashboard" isActive={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} />
                        <NavItem icon={<IconWallet className="w-6 h-6" />} label="Kas" isActive={activeTab === 'kas'} onClick={() => setActiveTab('kas')} />
                        <NavItem icon={<IconUtensils className="w-6 h-6" />} label="Uang Makan" isActive={activeTab === 'makan'} onClick={() => setActiveTab('makan')} />
                        <NavItem icon={<IconFileText className="w-6 h-6" />} label="Laporan" isActive={activeTab === 'laporan'} onClick={() => setActiveTab('laporan')} />
                    </nav>

                    <div className="print-only">
                        <LaporanPrintView summary={summary} transactions={transactions} meals={meals} saldoAwal={saldoAwal} todayStr={todayStr} />
                    </div>
                </div>
            );
        }

        function DashboardTab({ summary, saldoAwal, transactions, meals, setActiveTab, budgetMakan }) {
            return (
                <div className="space-y-6 animate-fade-in">
                    {/* 4 Cards Ringkasan */}
                    <div className="grid grid-cols-2 gap-3">
                        <SummaryCard title="Saldo Awal" amount={saldoAwal} icon={<IconWallet className="w-5 h-5 text-accent-blue" />} colorClass="text-slate-100" />
                        <SummaryCard title="Kas Masuk" amount={summary.kasMasuk} icon={<IconArrowUpCircle className="w-5 h-5 text-emerald-400" />} colorClass="text-emerald-400" />
                        <SummaryCard title="Pengeluaran" amount={summary.pengeluaran} icon={<IconArrowDownCircle className="w-5 h-5 text-red-400" />} colorClass="text-red-400" />
                        <SummaryCard title="Sisa Kas" amount={summary.sisaKas} icon={<IconWallet className="w-5 h-5 text-emerald-400" />} colorClass="text-emerald-400" highlight={true} />
                    </div>

                    {/* 4 Tombol Menu Cepat */}
                    <div className="grid grid-cols-4 gap-2">
                        <QuickMenuBtn icon={<IconArrowUpCircle className="w-6 h-6 text-emerald-400"/>} label="Kas Masuk" onClick={() => setActiveTab('kas')} />
                        <QuickMenuBtn icon={<IconArrowDownCircle className="w-6 h-6 text-red-400"/>} label="Pengeluaran" onClick={() => setActiveTab('kas')} />
                        <QuickMenuBtn icon={<IconUtensils className="w-6 h-6 text-accent-yellow"/>} label="Uang Makan" onClick={() => setActiveTab('makan')} />
                        <QuickMenuBtn icon={<IconFileText className="w-6 h-6 text-accent-blue"/>} label="Laporan" onClick={() => setActiveTab('laporan')} />
                    </div>

                    {/* Daftar Transaksi Harian */}
                    <div className="glass-card rounded-2xl p-4 border border-slate-700/50">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="font-bold text-sm flex items-center gap-2 text-white"><IconFileText className="w-4 h-4 text-emerald-400" /> Transaksi Harian</h3>
                            <button onClick={() => setActiveTab('kas')} className="text-xs text-emerald-400 font-medium">Lihat Semua</button>
                        </div>
                        <div className="space-y-2">
                            {transactions.length === 0 ? <div className="text-center py-4 text-sm text-slate-500">Belum ada transaksi</div> : transactions.slice(0, 5).map(tx => <TransactionItem key={tx.id} tx={tx} />)}
                        </div>
                    </div>
                </div>
            );
        }

        const SummaryCard = ({ title, amount, icon, colorClass, highlight = false }) => (
            <div className={`glass-card p-4 rounded-2xl flex flex-col justify-between ${highlight ? 'border-emerald-500/30 bg-emerald-900/20' : 'border border-slate-700/50'}`}>
                <div className="flex justify-between items-start mb-2"><div className="bg-dark-800 p-2 rounded-lg">{icon}</div></div>
                <div><h3 className="text-[11px] font-medium text-slate-400 mb-0.5">{title}</h3><p className={`font-bold text-base tracking-tight ${colorClass}`}>{formatRp(amount)}</p></div>
            </div>
        );

        const QuickMenuBtn = ({ icon, label, onClick }) => (
            <button onClick={onClick} className="glass-card flex flex-col items-center justify-center p-3 rounded-xl border border-slate-700/50 hover:bg-slate-800/80 transition-colors">
                <div className="mb-2">{icon}</div>
                <span className="text-[10px] font-semibold text-slate-300">{label}</span>
            </button>
        );

        const TransactionItem = ({ tx, onDelete, onEdit }) => (
            <div className="flex items-center justify-between p-3 rounded-xl bg-dark-800/40 border border-slate-700/30">
                <div className="flex items-center gap-3 w-[55%]">
                    <div className={`p-2 rounded-xl flex-shrink-0 ${tx.type === 'income' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-red-500/10 text-red-400'}`}>
                        {tx.type === 'income' ? <IconArrowUpCircle className="w-5 h-5"/> : <IconArrowDownCircle className="w-5 h-5"/>}
                    </div>
                    <div className="truncate pr-2">
                        <p className="font-bold text-[13px] text-slate-200 truncate">{tx.name}</p>
                        <p className="text-[11px] text-slate-400 truncate">{tx.description || '-'}</p>
                    </div>
                </div>
                <div className="text-right flex items-center justify-end w-[45%]">
                    <div className="flex flex-col items-end">
                        <p className={`font-bold text-[13px] tracking-tight ${tx.type === 'income' ? 'text-emerald-400' : 'text-red-400'}`}>{tx.type === 'income' ? '+ ' : '- '}{formatRp(tx.amount)}</p>
                        <p className="text-[10px] text-slate-500 flex items-center gap-1 mt-0.5"><IconCalendar className="w-3 h-3"/> {formatDate(tx.date)}</p>
                    </div>
                    <div className="flex ml-2 border-l border-slate-700/50 pl-2">
                        {onEdit && <button onClick={() => onEdit(tx)} className="p-1.5 text-slate-500 hover:text-accent-blue hover:bg-accent-blue/10 rounded-lg transition"><IconPencil className="w-4 h-4" /></button>}
                        {onDelete && <button onClick={() => onDelete(tx.id)} className="p-1.5 text-slate-500 hover:text-red-400 hover:bg-red-500/10 rounded-lg transition"><IconTrash className="w-4 h-4" /></button>}
                    </div>
                </div>
            </div>
        );

        function KasTab({ transactions, addTransaction, updateTransaction, deleteTransaction, saldoAwal, updateSaldoAwal }) {
            const [showForm, setShowForm] = useState(false);
            const [formType, setFormType] = useState('expense');
            const [saldoInputStr, setSaldoInputStr] = useState(saldoAwal === 0 ? '' : formatInput(saldoAwal.toString()));
            const [editingTxId, setEditingTxId] = useState(null);
            
            const incomeCategories = ['Top Up Kas', 'Lainnya'];
            // Kategori Pengeluaran Lengkap Sesuai Permintaan
            const expenseCategories = ['Upah Bongkar', 'Upah Muat', 'Insentif Pak Joni', 'Upah Kawal', 'Pembelian', 'Top Up E-Toll', 'Lainnya'];

            const [category, setCategory] = useState(expenseCategories[0]);
            const [desc, setDesc] = useState('');
            const [amount, setAmount] = useState(''); // Default KOSONG (menghindari angka 0 bandel)
            const [date, setDate] = useState(getTodayString());
            
            const [containerName, setContainerName] = useState('');
            const [containerSize, setContainerSize] = useState('20FT');

            const handleSaldoChange = (e) => {
                const val = e.target.value;
                const formatted = formatInput(val);
                setSaldoInputStr(formatted);
                updateSaldoAwal(parseInput(formatted));
            };

            const openAddForm = () => {
                setFormType('expense');
                setCategory(expenseCategories[0]);
                setDesc('');
                setAmount('');
                setDate(getTodayString());
                setContainerName('');
                setEditingTxId(null);
                setShowForm(true);
            };

            const handleEdit = (tx) => {
                setFormType(tx.type);
                
                // Menyesuaikan kategori dari transaksi lama ke opsi dropdown saat ini
                let cat = tx.category;
                if (tx.type === 'income' && cat !== 'Top Up Kas') cat = 'Lainnya';
                else if (tx.type === 'income' && cat === 'Kas Masuk') cat = 'Top Up Kas';
                
                setCategory(cat || (tx.type === 'income' ? 'Top Up Kas' : expenseCategories[0]));
                setDate(tx.date);
                setAmount(formatInput(tx.amount.toString()));
                
                // Ekstraksi data otomatis untuk Upah Bongkar & Lainnya
                if (cat === 'Upah Bongkar') {
                    const match = tx.name.match(/Upah Bongkar (.*?) \((.*?)\)/);
                    if (match) {
                        setContainerName(tx.containerName || match[1]);
                        setContainerSize(tx.containerSize || match[2]);
                    } else {
                        setContainerName(tx.containerName || '');
                        setContainerSize(tx.containerSize || '20FT');
                    }
                    setDesc(tx.description || '');
                } else if (cat === 'Lainnya' || tx.name !== cat) {
                    setDesc(cat === 'Lainnya' && tx.name !== 'Pengeluaran Lainnya' ? tx.name : (tx.description || ''));
                } else {
                    setDesc(tx.description || '');
                }
                
                setEditingTxId(tx.id);
                setShowForm(true);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if(!amount || !category) return; // Wajib isi nominal dan kategori
                
                let finalName = category;
                let finalDesc = desc;

                // Format khusus Upah Bongkar
                if (category === 'Upah Bongkar') {
                    if(containerName) finalName = `Upah Bongkar ${containerName} (${containerSize})`;
                } else if (category === 'Lainnya') {
                    finalName = desc || 'Pengeluaran Lainnya';
                    finalDesc = ''; 
                }
                
                const txData = {
                    type: formType,
                    name: finalName,
                    description: finalDesc,
                    amount: parseInput(amount),
                    date,
                    category: formType === 'income' ? (category === 'Top Up Kas' ? 'Top Up Kas' : 'Lainnya') : category,
                    containerName: category === 'Upah Bongkar' ? containerName : '',
                    containerSize: category === 'Upah Bongkar' ? containerSize : ''
                };

                if (editingTxId) {
                    updateTransaction({...txData, id: editingTxId});
                } else {
                    addTransaction(txData);
                }
                
                setShowForm(false);
                setDesc(''); setAmount(''); setContainerName('');
                setEditingTxId(null);
            };

            if (showForm) {
                return (
                    <div className="animate-fade-in glass-card rounded-2xl p-5 border border-slate-700/50">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-lg font-bold text-white flex items-center gap-2">
                                <button onClick={() => setShowForm(false)} className="mr-2 p-1.5 hover:bg-slate-700/50 rounded-full"><IconX className="w-5 h-5 text-slate-300"/></button>
                                {editingTxId ? 'Edit Transaksi' : 'Tambah Transaksi'}
                            </h2>
                        </div>
                        
                        <div className="flex gap-2 mb-5 bg-dark-800 p-1 rounded-xl">
                            <button onClick={() => { setFormType('income'); setCategory(incomeCategories[0]); }} type="button" className={`flex-1 py-2 text-sm font-semibold rounded-lg ${formType === 'income' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>Kas Masuk</button>
                            <button onClick={() => { setFormType('expense'); setCategory(expenseCategories[0]); }} type="button" className={`flex-1 py-2 text-sm font-semibold rounded-lg ${formType === 'expense' ? 'bg-red-600 text-white' : 'text-slate-400'}`}>Pengeluaran</button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-medium text-slate-400 mb-1.5">Tanggal</label>
                                <input type="date" value={date} onChange={e => setDate(e.target.value)} required className="w-full bg-dark-800 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none" />
                            </div>
                            
                            <div>
                                <label className="block text-xs font-medium text-slate-400 mb-1.5">Kategori Transaksi</label>
                                <select value={category} onChange={e => setCategory(e.target.value)} className="w-full bg-dark-800 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none">
                                    {(formType === 'income' ? incomeCategories : expenseCategories).map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                </select>
                            </div>
                            
                            {/* Form Detail Kontainer - HANYA muncul jika kategori "Upah Bongkar" */}
                            {category === 'Upah Bongkar' && (
                                <div className="flex gap-3 bg-dark-800/50 p-3 rounded-xl border border-slate-700/50 animate-fade-in">
                                    <div className="flex-1">
                                        <label className="block text-xs font-medium text-slate-400 mb-1.5">Nama Kontainer</label>
                                        <input type="text" value={containerName} onChange={e => setContainerName(e.target.value.toUpperCase())} placeholder="Cth: GAL181" className="w-full bg-dark-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white outline-none uppercase" />
                                    </div>
                                    <div className="w-[100px]">
                                        <label className="block text-xs font-medium text-slate-400 mb-1.5">Ukuran</label>
                                        <select value={containerSize} onChange={e => setContainerSize(e.target.value)} className="w-full bg-dark-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white outline-none">
                                            <option value="20FT">20FT</option><option value="40FT">40FT</option><option value="45FT">45FT</option><option value="LCL">LCL</option>
                                        </select>
                                    </div>
                                </div>
                            )}

                            <div>
                                <label className="block text-xs font-medium text-slate-400 mb-1.5">{category === 'Lainnya' ? 'Nama / Keterangan Transaksi' : 'Keterangan Tambahan (Opsional)'}</label>
                                <input type="text" value={desc} onChange={e => setDesc(e.target.value)} placeholder="Ketik keterangan..." className="w-full bg-dark-800 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none" required={category === 'Lainnya'} />
                            </div>
                            
                            <div>
                                <label className="block text-xs font-medium text-slate-400 mb-1.5">Nominal (Rp)</label>
                                {/* Default kosong tanpa 0 */}
                                <input type="text" inputMode="numeric" value={amount} onChange={e => setAmount(formatInput(e.target.value))} required placeholder="Misal: 1.000.000" className="w-full bg-dark-800 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none" />
                            </div>
                            
                            <button type="submit" className={`w-full py-3.5 mt-2 rounded-xl font-bold text-white shadow-lg ${formType === 'income' ? 'bg-emerald-600' : 'bg-red-600'}`}>Simpan</button>
                        </form>
                    </div>
                );
            }

            return (
                <div className="space-y-4 animate-fade-in">
                    <div className="flex justify-between items-center">
                        <h2 className="text-xl font-bold text-white">Buku Kas</h2>
                        <button onClick={openAddForm} className="flex items-center gap-1.5 bg-emerald-600 px-4 py-2 rounded-xl text-sm font-semibold shadow-lg shadow-emerald-900/20"><IconPlus className="w-4 h-4"/> Tambah</button>
                    </div>
                    
                    <div className="glass-card p-3 rounded-xl border border-slate-700/50 flex justify-between items-center bg-dark-800/80">
                        <span className="text-sm font-medium text-slate-300">Saldo Awal</span>
                        {/* Menghilangkan angka 0 bandel */}
                        <input type="text" inputMode="numeric" value={saldoInputStr} onChange={handleSaldoChange} placeholder="0" className="bg-dark-900 border border-slate-600 rounded-lg p-1.5 text-sm font-bold text-white w-28 text-right outline-none focus:border-emerald-500" />
                    </div>

                    <div className="glass-card rounded-2xl p-2 min-h-[50vh] border border-slate-700/30">
                        <div className="space-y-2">
                            {transactions.length === 0 ? <p className="text-center text-sm text-slate-500 py-10">Belum ada transaksi</p> : transactions.map(tx => <TransactionItem key={tx.id} tx={tx} onDelete={deleteTransaction} onEdit={handleEdit} />)}
                        </div>
                    </div>
                </div>
            );
        }

        function MakanTab({ meals, updateMeal, budgetMakan, setBudgetMakan, addTransaction, setMeals }) {
            const [showTarikModal, setShowTarikModal] = useState(false);
            const [tarikAmount, setTarikAmount] = useState(''); // Default kosong agar tidak ada 0 bandel
            const [editingId, setEditingId] = useState(null);
            const [editValue, setEditValue] = useState(''); // Default kosong
            
            const totalUsed = meals.reduce((sum, m) => sum + (m.amount || 0), 0);
            const remaining = budgetMakan - totalUsed;
            const percentage = Math.min(100, Math.round((totalUsed / budgetMakan) * 100)) || 0;

            const handleTarikKas = (e) => {
                e.preventDefault();
                const numAmount = parseInput(tarikAmount);
                if (numAmount <= 0) return;
                
                setBudgetMakan(numAmount);
                // Otomatis tercatat di Kas Utama sebagai pengeluaran
                addTransaction({ type: 'expense', name: 'Tarik Budget Uang Makan', description: `Budget Mingguan Baru`, amount: numAmount, date: getTodayString(), category: 'Lainnya' });
                // Reset harian
                setMeals(meals.map(m => ({...m, amount: 0}))); 
                setShowTarikModal(false);
                setTarikAmount(''); // reset modal input
            };

            const saveInlineEdit = (id) => {
                const val = parseInput(editValue);
                updateMeal(id, val);
                setEditingId(null);
            };

            return (
                <div className="space-y-4 animate-fade-in">
                    <h2 className="text-xl font-bold text-white mb-2">Uang Makan</h2>
                     
                     {showTarikModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
                            <div className="bg-dark-800 border border-slate-700 rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden animate-fade-in">
                                <div className="p-5 border-b border-slate-700/50"><h3 className="text-lg font-bold text-white">Tarik Budget dari Kas</h3><p className="text-xs text-slate-400 mt-1">Otomatis memotong kas utama & mereset rekapan harian.</p></div>
                                <form onSubmit={handleTarikKas} className="p-5">
                                    <label className="block text-xs font-medium text-slate-400 mb-1.5">Nominal (Rp)</label>
                                    <input type="text" inputMode="numeric" value={tarikAmount} onChange={e => setTarikAmount(formatInput(e.target.value))} required placeholder="Misal: 1.200.000" className="w-full bg-dark-900 border border-slate-700 rounded-xl p-3 text-sm text-white mb-5 outline-none focus:border-accent-yellow" />
                                    <div className="flex justify-end gap-2">
                                        <button type="button" onClick={() => setShowTarikModal(false)} className="px-4 py-2 text-sm font-medium text-slate-300 bg-dark-700 rounded-lg">Batal</button>
                                        <button type="submit" className="px-4 py-2 text-sm font-medium text-dark-900 bg-accent-yellow rounded-lg font-bold hover:bg-yellow-400">Konfirmasi</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                     )}

                     <div className="flex justify-between items-center bg-dark-800/80 p-3.5 rounded-xl border border-slate-700/50">
                        <div><p className="text-[11px] font-medium text-slate-400">Periode Minggu Baru?</p><p className="text-sm font-bold text-white">Isi Budget Uang Makan</p></div>
                        <button onClick={() => {setShowTarikModal(true); setTarikAmount('');}} className="flex items-center gap-1.5 bg-accent-yellow text-dark-900 px-3 py-2 rounded-lg text-xs font-bold hover:bg-yellow-400 transition"><IconWallet className="w-4 h-4" /> Tarik Kas</button>
                     </div>

                     <div className="glass-card rounded-2xl p-5 border border-accent-yellow/30 bg-gradient-to-br from-dark-800 to-dark-900">
                        <div className="flex justify-between items-end">
                            <div><p className="text-xs font-medium text-slate-400 mb-1">Sisa Budget</p><p className="text-3xl font-extrabold text-accent-yellow">{formatRp(remaining)}</p></div>
                            <div className="text-right"><p className="text-[10px] text-slate-400">Total: <span className="font-bold text-slate-200">{formatRp(budgetMakan)}</span></p><p className="text-[10px] text-slate-400">Pakai: <span className="font-bold text-red-400">{formatRp(totalUsed)}</span></p></div>
                        </div>
                        <div className="w-full bg-dark-900/60 rounded-full h-1.5 mt-4 overflow-hidden border border-slate-700/50"><div className={`h-full rounded-full transition-all duration-500 ${percentage > 90 ? 'bg-red-500' : 'bg-emerald-500'}`} style={{ width: `${percentage}%` }}></div></div>
                    </div>

                    <div className="glass-card rounded-2xl p-4 border border-slate-700/50">
                        <h3 className="font-bold text-sm text-white mb-4 flex items-center gap-2"><IconUtensils className="w-4 h-4 text-accent-yellow" /> Pengeluaran Harian</h3>
                        <div className="space-y-2">
                            {meals.map((meal, index) => {
                                let currentSisa = budgetMakan;
                                for(let i=0; i<=index; i++) currentSisa -= (meals[i].amount || 0);
                                
                                return (
                                <div key={meal.id} className="flex items-center justify-between py-2.5 border-b border-slate-800/50 last:border-0">
                                    <div className="w-14 text-xs font-bold text-slate-300">{meal.day}</div>
                                    
                                    <div className="flex-1 flex justify-center">
                                        {editingId === meal.id ? (
                                            <input autoFocus type="text" inputMode="numeric" value={editValue} onChange={e => setEditValue(formatInput(e.target.value))} onBlur={() => saveInlineEdit(meal.id)} onKeyDown={e => e.key === 'Enter' && saveInlineEdit(meal.id)} className="w-28 bg-dark-900 border border-accent-yellow rounded-lg py-1.5 px-2 text-xs font-bold text-white outline-none text-center" placeholder="Isi angka..." />
                                        ) : (
                                            <div onClick={() => { setEditingId(meal.id); setEditValue(meal.amount === 0 ? '' : formatInput(meal.amount.toString())); }} className={`w-28 text-center py-1.5 rounded-lg cursor-pointer text-xs transition ${meal.amount > 0 ? 'bg-dark-800 text-white font-bold border border-slate-600' : 'border border-dashed border-slate-600 text-slate-400 hover:text-accent-yellow hover:border-accent-yellow'}`}>
                                                {meal.amount > 0 ? formatRp(meal.amount) : '+ Isi Nominal'}
                                            </div>
                                        )}
                                    </div>

                                    <div className="w-24 text-right flex flex-col items-end">
                                        {meal.amount > 0 ? <span className="flex items-center gap-1 text-[9px] text-emerald-400 font-bold"><IconCheck className="w-3 h-3"/> Sesuai</span> : <span className="flex items-center gap-1 text-[9px] text-slate-500 font-bold"><IconX className="w-3 h-3"/> Belum</span>}
                                        <span className="text-[9px] text-slate-400 font-medium">Sisa: <span className="text-slate-200">{formatRp(currentSisa)}</span></span>
                                    </div>
                                </div>
                            )})}
                        </div>
                    </div>
                </div>
            );
        }

        function LaporanTab({ summary, transactions, meals, saldoAwal, todayStr, handlePrint, handleShareWA }) {
            const [filterMode, setFilterMode] = useState('harian');
            const [selectedDate, setSelectedDate] = useState(todayStr);
            const [selectedMonth, setSelectedMonth] = useState(todayStr.substring(0, 7));

            const filteredTxs = useMemo(() => transactions.filter(tx => filterMode === 'harian' ? tx.date === selectedDate : tx.date.startsWith(selectedMonth)), [transactions, filterMode, selectedDate, selectedMonth]);

            const pSum = useMemo(() => {
                const kasMasuk = filteredTxs.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
                const pengeluaran = filteredTxs.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);
                return { kasMasuk, pengeluaran, sisaKas: saldoAwal + kasMasuk - pengeluaran, totalMakan: summary.totalMakan };
            }, [filteredTxs, saldoAwal, summary.totalMakan]);

            const onShare = () => {
                const dLabel = filterMode === 'harian' ? formatDate(selectedDate) : `Bulan ${selectedMonth}`;
                handleShareWA(filteredTxs, dLabel, pSum);
            };

            return (
                 <div className="space-y-4 animate-fade-in">
                    <h2 className="text-xl font-bold text-white">Laporan & Cetak</h2>
                    <div className="glass-card p-4 rounded-2xl border border-slate-700/50">
                        <div className="flex gap-2 p-1 bg-dark-800 rounded-xl mb-4 border border-slate-700/50">
                            <button onClick={() => setFilterMode('harian')} className={`flex-1 py-2 text-sm font-semibold rounded-lg transition ${filterMode === 'harian' ? 'bg-accent-blue text-white shadow-lg' : 'text-slate-400'}`}>Harian</button>
                            <button onClick={() => setFilterMode('bulanan')} className={`flex-1 py-2 text-sm font-semibold rounded-lg transition ${filterMode === 'bulanan' ? 'bg-accent-blue text-white shadow-lg' : 'text-slate-400'}`}>Bulanan</button>
                        </div>
                        {filterMode === 'harian' ? <input type="date" value={selectedDate} onChange={e=>setSelectedDate(e.target.value)} className="w-full bg-dark-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none"/> : <input type="month" value={selectedMonth} onChange={e=>setSelectedMonth(e.target.value)} className="w-full bg-dark-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none"/>}
                    </div>

                    <div className="flex gap-3">
                        <button onClick={onShare} className="flex-1 flex justify-center items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition shadow-[0_0_15px_rgba(16,185,129,0.2)]"><IconShare className="w-5 h-5"/> Kirim WA</button>
                        <button onClick={handlePrint} className="flex-1 flex justify-center items-center gap-2 bg-dark-700 hover:bg-dark-600 border border-slate-600 text-white font-bold py-3.5 rounded-xl transition"><IconPrinter className="w-5 h-5"/> Cetak PDF</button>
                    </div>

                    <div className="glass-card rounded-2xl p-4 border border-slate-700/50">
                        <h3 className="text-sm font-bold text-white mb-4">Preview Transaksi ({filteredTxs.length})</h3>
                        <div className="space-y-2">{filteredTxs.length === 0 ? <p className="text-center text-sm text-slate-500 py-4">Data kosong pada periode ini</p> : filteredTxs.map(tx => <TransactionItem key={tx.id} tx={tx} />)}</div>
                    </div>
                 </div>
            );
        }

        function LaporanPrintView({ summary, transactions, meals, saldoAwal, todayStr }) {
            return (
                <div className="p-10 max-w-5xl mx-auto text-black bg-white font-sans">
                    <div className="flex justify-between items-center mb-8 border-b-4 border-black pb-6">
                        <div><h1 className="text-4xl font-extrabold uppercase tracking-widest mb-1 text-black">Warehouse X GLX</h1><p className="text-sm text-gray-600">Logistics & Warehouse Solution</p></div>
                        <div className="text-right"><h2 className="text-2xl font-bold text-black">LAPORAN KAS</h2><p className="text-md text-gray-600 mt-1 font-medium">Periode: {formatDate(todayStr)}</p></div>
                    </div>

                    <div className="grid grid-cols-2 gap-12 mb-10">
                        <div>
                            <h3 className="font-bold text-xl mb-4 bg-gray-100 p-2 border-l-4 border-black">Ringkasan Keuangan</h3>
                            <table className="w-full text-base border border-gray-300">
                                <tbody>
                                    <tr className="border-b"><td className="py-2 px-2">Saldo Awal</td><td className="text-right py-2 px-2 font-bold">{formatRp(saldoAwal)}</td></tr>
                                    <tr className="border-b"><td className="py-2 px-2">Total Pemasukan</td><td className="text-right py-2 px-2 font-bold text-green-700">+{formatRp(summary.kasMasuk)}</td></tr>
                                    <tr className="border-b"><td className="py-2 px-2">Total Pengeluaran</td><td className="text-right py-2 px-2 font-bold text-red-700">-{formatRp(summary.pengeluaran)}</td></tr>
                                    <tr className="border-b"><td className="py-2 px-2">Total Uang Makan</td><td className="text-right py-2 px-2 font-bold text-orange-600">-{formatRp(summary.totalMakan)}</td></tr>
                                    <tr className="font-bold text-xl bg-gray-50"><td className="py-3 px-2">SISA KAS TOTAL</td><td className="text-right py-3 px-2">{formatRp(summary.sisaKas - summary.totalMakan)}</td></tr>
                                </tbody>
                            </table>
                        </div>
                        <div>
                             <h3 className="font-bold text-xl mb-4 bg-gray-100 p-2 border-l-4 border-black">Uang Makan Mingguan</h3>
                             <table className="w-full text-base border border-gray-300">
                                <tbody>
                                    {meals.filter(m => m.amount > 0).map(m => <tr key={m.id} className="border-b border-gray-200"><td className="py-2 px-2">{m.day}</td><td className="text-right py-2 px-2 font-medium">{formatRp(m.amount)}</td></tr>)}
                                    <tr className="font-bold bg-gray-50"><td className="py-3 px-2">Total Terpakai</td><td className="text-right py-3 px-2">{formatRp(summary.totalMakan)}</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <h3 className="font-bold text-xl mb-4 bg-gray-100 p-2 border-l-4 border-black">Detail Transaksi Kas</h3>
                    <table className="w-full border-collapse border border-gray-400 mb-16 text-sm">
                        <thead><tr className="bg-gray-200 text-black"><th className="border border-gray-400 p-3 w-12">No</th><th className="border border-gray-400 p-3 text-left">Nama / Keterangan</th><th className="border border-gray-400 p-3 text-right">Pemasukan</th><th className="border border-gray-400 p-3 text-right">Pengeluaran</th></tr></thead>
                        <tbody>
                            {transactions.map((tx, idx) => (
                                <tr key={tx.id} className="border-b border-gray-300">
                                    <td className="border border-gray-400 p-3 text-center">{idx + 1}</td>
                                    <td className="border border-gray-400 p-3"><div className="font-bold">{tx.name}</div><div className="text-xs text-gray-600">{tx.description}</div></td>
                                    <td className="border border-gray-400 p-3 text-right font-bold text-green-700">{tx.type === 'income' ? formatRp(tx.amount) : ''}</td>
                                    <td className="border border-gray-400 p-3 text-right font-bold text-red-700">{tx.type === 'expense' ? formatRp(tx.amount) : ''}</td>
                                </tr>
                            ))}
                            {transactions.length === 0 && <tr><td colSpan="4" className="border border-gray-400 p-4 text-center italic text-gray-500">Kosong</td></tr>}
                        </tbody>
                    </table>

                    <div className="flex justify-between px-16 mt-24"><div className="text-center"><p className="mb-20 text-gray-600">Mengetahui,</p><p className="font-bold border-b-2 border-black pb-1 px-8">Kepala Gudang</p></div><div className="text-center"><p className="mb-20 text-gray-600">Dibuat Oleh,</p><p className="font-bold border-b-2 border-black pb-1 px-8">Admin Kas</p></div></div>
                </div>
            );
        }

        const NavItem = ({ icon, label, isActive, onClick }) => (
            <button onClick={onClick} className={`flex flex-col items-center p-2 w-16 transition-all ${isActive ? 'text-emerald-400' : 'text-slate-500 hover:text-slate-300'}`}>
                <div className={`mb-1 transition-all ${isActive ? '-translate-y-1 scale-110 drop-shadow-[0_0_8px_rgba(52,211,153,0.6)]' : ''}`}>{icon}</div>
                <span className={`text-[10px] font-semibold`}>{label}</span>
            </button>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
